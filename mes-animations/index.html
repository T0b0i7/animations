<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Animations</title>
    <style>
        body {
            background-color: #0f0c29;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ff1493;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a { color: #ff69b4; text-decoration: none; margin-top: 10px; }
    </style>
    <!-- Redirection automatique -->
    <meta http-equiv="refresh" content="0; url=./Chaddy_Birthday/">
</head>
<body>
    <div class="loader"></div>
    <p>Chargement de l'animation...</p>
    <p>Si la redirection ne fonctionne pas, <a href="./Chaddy_Birthday/">cliquez ici</a>.</p>

    <script>
        // Redirection JavaScript en secours
        window.location.href = "./Chaddy_Birthday/";
    </script>
</body>
</html>
