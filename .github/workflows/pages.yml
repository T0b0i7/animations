name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build lamp-login (React/Vite)
        working-directory: lamp-login
        run: |
          npm ci
          npm run build

      - name: Build interactive-birthday-gift (Vite)
        working-directory: interactive-birthday-gift
        run: |
          npm ci
          npm run build

      - name: Build iron-man (Next.js static export)
        working-directory: iron-man
        env:
          NEXT_PUBLIC_BASE_PATH: /animations/iron-man
        run: |
          npm ci
          npm run build

      - name: Build 3d-shoe-finder (Next.js static export)
        working-directory: 3d-shoe-finder
        env:
          NEXT_PUBLIC_BASE_PATH: /animations/3d-shoe-finder
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='lamp-login' \
            --exclude='interactive-birthday-gift' \
            --exclude='iron-man' \
            --exclude='3d-shoe-finder' \
            --exclude='3d_animated_carousel' \
            --exclude='404_Page_Not_Found' \
            --exclude='_site' \
            ./ _site/
          mkdir -p _site/lamp-login _site/interactive-birthday-gift _site/iron-man _site/3d-shoe-finder
          cp -r lamp-login/dist/. _site/lamp-login/
          cp -r interactive-birthday-gift/dist/. _site/interactive-birthday-gift/
          cp -r iron-man/out/. _site/iron-man/
          cp -r 3d-shoe-finder/out/. _site/3d-shoe-finder/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
