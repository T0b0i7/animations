<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animated Login Form</title>
<style>
:root{
  --line:#2a2a3d; --txt:#f4f4fa; --muted:#9494ab;
  --accent:#6c5cff; --accent2:#22d3ee; --ok:#3ddc97; --err:#ff6b81;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:grid;place-items:center;padding:22px;overflow:hidden;
  background:
    radial-gradient(1200px 600px at 15% -10%, #2a1c6b55, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #0e5f6f55, transparent 55%),
    linear-gradient(160deg,#0b0b14,#12102a);
  color:var(--txt);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:drift 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:var(--accent);top:-90px;left:-70px}
.orb.b{width:300px;height:300px;background:var(--accent2);bottom:-110px;right:-60px;animation-delay:-6s}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(24px,18px,0) scale(1.08)}}
.card{position:relative;width:min(380px,100%);padding:32px 28px 26px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(180deg,#17172499,#0f0f17cc);backdrop-filter:blur(14px);
  box-shadow:0 30px 70px -30px #000, inset 0 1px 0 #ffffff12;animation:cardIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.logo{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 16px;border-radius:18px;
  background:linear-gradient(140deg,#6c5cff33,#22d3ee22);border:1px solid #ffffff1f;position:relative;
  animation:logoIn .8s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
.logo::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,#6c5cff55,transparent 70%);
  animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.8;transform:scale(1.1)}}
.logo svg{position:relative;z-index:1;width:30px;height:30px;overflow:visible}
.logo path,.logo circle{stroke:url(#g);stroke-width:2.4;fill:none;stroke-linecap:round;
  stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.6s .35s ease forwards}
.logo circle{animation-delay:.95s;stroke-dasharray:80;stroke-dashoffset:80}
@keyframes draw{to{stroke-dashoffset:0}}
h1{margin:0 0 4px;font-size:19px;letter-spacing:-.02em;text-align:center}
.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:13px}
.field{position:relative;margin-bottom:16px}
.field input{width:100%;padding:16px 44px 14px 14px;border-radius:12px;border:1px solid var(--line);
  background:#0d0d16;color:var(--txt);font:inherit;font-size:14px;outline:none;transition:border-color .25s,box-shadow .25s}
.field input:focus{border-color:#6c5cff;box-shadow:0 0 0 3px #6c5cff26}
.field label{position:absolute;left:14px;top:15px;color:var(--muted);font-size:14px;pointer-events:none;
  transition:.2s cubic-bezier(.2,.8,.2,1);background:transparent;padding:0 4px}
.field input:focus + label,.field input:not(:placeholder-shown) + label{top:-8px;left:10px;font-size:11px;color:#a9a2ff;background:#12121c}
.field .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.field .toggle:hover{color:var(--txt);background:#ffffff10}
.row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px;font-size:12.5px;color:var(--muted)}
.row label{display:flex;align-items:center;gap:7px;cursor:pointer}
.row input[type=checkbox]{appearance:none;width:15px;height:15px;border:1px solid var(--line);border-radius:4px;background:#0d0d16;cursor:pointer;position:relative}
.row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.row input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.row a{color:#a9a2ff;text-decoration:none}
.row a:hover{text-decoration:underline}
.btn{position:relative;width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;overflow:hidden;
  font:inherit;font-size:14px;font-weight:650;color:#fff;
  background:linear-gradient(100deg,var(--accent),#4f7cff);transition:transform .18s,filter .18s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
.btn[disabled]{cursor:default;filter:saturate(.7)}
.btn .spinner{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.btn.loading .label{opacity:0}
.btn.loading .spinner{opacity:1}
.btn .spinner i{width:16px;height:16px;border-radius:50%;border:2px solid #ffffff55;border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.btn.done{background:linear-gradient(100deg,#25b47c,#3ddc97)}
.msg{min-height:18px;margin-top:12px;font-size:12.5px;text-align:center;color:var(--err);opacity:0;transform:translateY(-4px);transition:.25s}
.msg.show{opacity:1;transform:none}
.msg.ok{color:var(--ok)}
@media (max-width:420px){.card{padding:26px 20px 22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main class="card">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8b7bff"/><stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient></defs>
      <path d="M16 4 27 10v12L16 28 5 22V10z" />
      <circle cx="16" cy="16" r="4.2" />
    </svg>
  </div>

  <h1>Connexion</h1>
  <p class="sub">Accédez à votre espace en un instant.</p>

  <form id="form" novalidate>
    <div class="field">
      <input id="email" type="email" placeholder=" " autocomplete="email" required />
      <label for="email">Adresse e-mail</label>
    </div>
    <div class="field">
      <input id="password" type="password" placeholder=" " autocomplete="current-password" required />
      <label for="password">Mot de passe</label>
      <button class="toggle" type="button" id="toggle" aria-label="Afficher le mot de passe">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="remember" /> Se souvenir de moi</label>
      <a href="#">Mot de passe oublié ?</a>
    </div>
    <button class="btn" type="submit" id="submit">
      <span class="label">Se connecter</span>
      <span class="spinner"><i></i></span>
    </button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>
<script>
const form = document.getElementById('form');
const email = document.getElementById('email');
const password = document.getElementById('password');
const submit = document.getElementById('submit');
const msg = document.getElementById('msg');
const toggle = document.getElementById('toggle');

toggle.addEventListener('click', () => {
  const shown = password.type === 'text';
  password.type = shown ? 'password' : 'text';
  toggle.setAttribute('aria-label', shown ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
});

function say(text, ok = false) {
  msg.textContent = text;
  msg.classList.toggle('ok', ok);
  msg.classList.add('show');
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  msg.classList.remove('show');
  submit.classList.remove('done');

  if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value)) {
    say('Entre une adresse e-mail valide.');
    email.focus();
    return;
  }
  if (password.value.length < 6) {
    say('Le mot de passe doit faire au moins 6 caractères.');
    password.focus();
    return;
  }

  submit.classList.add('loading');
  submit.disabled = true;

  setTimeout(() => {
    submit.classList.remove('loading');
    submit.classList.add('done');
    submit.querySelector('.label').textContent = 'Connecté';
    say('Bienvenue ! Redirection en cours…', true);
    setTimeout(() => {
      submit.disabled = false;
      submit.classList.remove('done');
      submit.querySelector('.label').textContent = 'Se connecter';
    }, 2200);
  }, 1200);
});
</script>
</body>
</html>
